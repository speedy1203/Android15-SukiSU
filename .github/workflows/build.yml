name: Android 15 KernelSU

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Clone kernel
        run: |
          git clone --depth=1 --branch android15-6.6.50_r00 https://android.googlesource.com/kernel/common common/kernel

      - name: Integrate KernelSU
        run: |
          cd common/kernel
          curl -LSs https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh | bash -s main

      - name: Enable KernelSU
        run: |
          cd common/kernel
          echo 'CONFIG_KSU=y' >> arch/x86/configs/gki_defconfig
          echo 'CONFIG_KSU_X86_PATCH_SYSCALL_DISPATCHER=y' >> arch/x86/configs/gki_defconfig

      - name: Clone build system
        run: |
          git clone --depth=1 https://android.googlesource.com/kernel/build build
          test -f build/build.sh

      - name: Check
        run: |
          echo "KernelSU:"
          test -d common/kernel/KernelSU
          echo "KernelSU OK"
          echo "Build system:"
          ls -l build/build.sh
