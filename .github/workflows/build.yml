name: Build Android 15 KernelSU

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl python3 bc bison flex \
            build-essential libssl-dev libelf-dev pahole \
            rsync cpio lz4 zip unzip

      - name: Clone Android 15 kernel
        run: |
          git clone --depth=1 \
            --branch android15-6.6.50_r00 \
            https://android.googlesource.com/kernel/common \
            common

      - name: Clone Kleaf build system
        run: |
          mkdir -p build
          git clone --depth=1 \
            --branch main-kernel-build-2024 \
            https://android.googlesource.com/kernel/build \
            build/kernel

      - name: Create Kleaf workspace files
        run: |
          cp build/kernel/kleaf/bazel.WORKSPACE WORKSPACE
          cp build/kernel/kleaf/bazel.MODULE.bazel MODULE.bazel

      - name: Integrate official KernelSU
        working-directory: common
        run: |
          curl -LSs \
            https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh \
            | bash -s main

      - name: Enable KernelSU
        working-directory: common
        run: |
          echo 'CONFIG_KSU=y' >> arch/x86/configs/gki_defconfig
          echo 'CONFIG_KSU_X86_PATCH_SYSCALL_DISPATCHER=y' >> arch/x86/configs/gki_defconfig

      - name: Verify
        run: |
          test -f common/BUILD.bazel
          test -f common/build.config.gki.x86_64
          test -f build/kernel/kleaf/bazel.sh
          test -d common/KernelSU
          echo "OFFICIAL KERNELSU + KLEAF READY"

      - name: Build x86_64 Kernel
        run: |
          chmod +x build/kernel/kleaf/bazel.sh
          build/kernel/kleaf/bazel.sh build //common:kernel_x86_64

      - name: Build distribution
        if: success()
        run: |
          build/kernel/kleaf/bazel.sh run //common:kernel_x86_64_dist -- \
            --destdir="$GITHUB_WORKSPACE/out/dist"

      - name: Find kernel
        if: always()
        run: |
          echo "=== KERNEL OUTPUTS ==="
          find . -type f \
            \( -name bzImage -o -name Image \) \
            -printf '%p %s bytes\n' | head -50

      - name: Upload KernelSU kernel
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Android15-KernelSU-x86_64
          path: |
            out/dist/**
            bazel-bin/common/**
          if-no-files-found: warn
