name: Build Android 15 SukiSU Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git curl python3 bc bison flex \
            build-essential ccache libssl-dev \
            libelf-dev pahole zip unzip rsync lz4 cpio

      - name: Clone Android 15 kernel
        run: |
          git clone --depth=1 \
            --branch android15-6.6.50_r00 \
            https://android.googlesource.com/kernel/common \
            common/kernel

      - name: Integrate SukiSU
        working-directory: common/kernel
        run: |
          curl -LSs \
            "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" \
            | bash -s main

      - name: Clone Android kernel build system
        run: |
          git clone --depth=1 \
            https://android.googlesource.com/kernel/build \
            build

            - name: Get exact Clang
        run: |
          git clone --depth=1 \
            --filter=blob:none \
            --no-checkout \
            --branch android15-release \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            prebuilts/clang/host/linux-x86

          cd prebuilts/clang/host/linux-x86
          git sparse-checkout set clang-r510928
          git checkout

      - name: Check build configuration
        working-directory: common/kernel
        run: |
          grep -E "CLANG_VERSION|CLANG_PREBUILT_BIN|HERMETIC_TOOLCHAIN" \
            build.config.common || true

      - name: Build kernel
        working-directory: common/kernel
        run: |
          BUILD_CONFIG=build.config.gki.x86_64 \
            bash "$GITHUB_WORKSPACE/build/build.sh" -j2

      - name: Locate kernel output
        run: |
          find "$GITHUB_WORKSPACE" -type f \
            \( -name "Image" -o -name "Image.lz4" -o -name "vmlinux" \) \
            -print

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: android15-sukisu-kernel
          path: |
            **/dist/**
            **/Image
            **/Image.lz4
            **/vmlinux
