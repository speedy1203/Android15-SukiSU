name: Build Android 15 SukiSU Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git curl python3 bc bison flex \
            build-essential ccache libssl-dev \
            libelf-dev pahole zip unzip rsync

      - name: Clone exact Android 15 kernel
        run: |
          git clone --depth=1 \
            --branch android15-6.6.50_r00 \
            https://android.googlesource.com/kernel/common \
            kernel

      - name: Integrate SukiSU
        working-directory: kernel
        run: |
          curl -LSs \
            "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" \
            | bash -s main

      - name: Verify SukiSU
        working-directory: kernel
        run: |
          test -d KernelSU
          echo "SukiSU integration successful"

      - name: Check kernel configuration
        working-directory: kernel
        run: |
          grep -E "CONFIG_KSU|CONFIG_KALLSYMS|CONFIG_CFI_CLANG" \
            build.config.gki.x86_64 || true
